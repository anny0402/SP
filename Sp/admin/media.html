<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Manager | Admin Panel</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <style>
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .media-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background: var(--surface-color);
            border: 1px solid var(--glass-border);
        }

        .media-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .media-info {
            padding: 10px;
        }

        .media-info .cat {
            font-size: 0.7rem;
            color: var(--primary-gold);
            text-transform: uppercase;
        }

        .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 0, 0, 0.7);
            color: #fff;
            border: none;
            padding: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.6rem;
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">SP ADMIN</div>
            <nav style="flex: 1;">
                <a href="dashboard.html" class="nav-item">Dashboard</a>
                <a href="inquiries.html" class="nav-item">Inquiries</a>
                <a href="media.html" class="nav-item active">Media Manager</a>
            </nav>
            <a href="#" onclick="logout()" class="nav-item" style="color: #ff4d4d;">Logout</a>
        </aside>

        <main class="admin-main">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
                <h1 class="serif">MEDIA <span style="color: var(--primary-gold);">MANAGER</span></h1>
                <button onclick="document.getElementById('upload-modal').style.display='flex'" class="btn">+ ADD
                    PHOTO</button>
            </header>

            <div class="media-grid" id="admin-media-grid">
                <!-- Loaded via JS -->
            </div>
        </main>
    </div>

    <!-- Upload Modal -->
    <div class="modal" id="upload-modal">
        <div class="modal-content">
            <h2 class="serif" style="margin-bottom: 20px;">UPLOAD NEW PHOTO</h2>
            <form id="upload-form">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label>IMAGE URL</label>
                    <input type="text" id="img-url" required placeholder="https://example.com/photo.jpg">
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label>CATEGORY</label>
                    <select id="img-cat">
                        <option value="wedding">Wedding</option>
                        <option value="portrait">Portrait</option>
                        <option value="event">Event</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 25px;">
                    <label>LAYOUT SIZE</label>
                    <select id="img-size">
                        <option value="normal">Normal</option>
                        <option value="wide">Wide (2 columns)</option>
                        <option value="tall">Tall (2 rows)</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn" style="flex: 1;">SAVE PHOTO</button>
                    <button type="button" onclick="document.getElementById('upload-modal').style.display='none'"
                        class="btn btn-outline" style="flex: 1;">CANCEL</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        function loadMedia() {
            const photos = JSON.parse(localStorage.getItem('portfolio_photos') || '[]');
            const grid = document.getElementById('admin-media-grid');
            grid.innerHTML = '';

            photos.reverse().forEach(photo => {
                const item = document.createElement('div');
                item.className = 'media-item';
                item.innerHTML = `
                    <button class="delete-btn" onclick="deletePhoto(${photo.id})">DELETE</button>
                    <img src="${photo.src}" alt="">
                    <div class="media-info">
                        <div class="cat">${photo.category}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted)">ID: ${photo.id}</div>
                    </div>
                `;
                grid.appendChild(item);
            });
        }

        function deletePhoto(id) {
            let photos = JSON.parse(localStorage.getItem('portfolio_photos') || '[]');
            photos = photos.filter(p => p.id !== id);
            localStorage.setItem('portfolio_photos', JSON.stringify(photos));
            loadMedia();
        }

        document.getElementById('upload-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const photos = JSON.parse(localStorage.getItem('portfolio_photos') || '[]');
            const newPhoto = {
                id: Date.now(),
                src: document.getElementById('img-url').value,
                category: document.getElementById('img-cat').value,
                size: document.getElementById('img-size').value
            };
            photos.push(newPhoto);
            localStorage.setItem('portfolio_photos', JSON.stringify(photos));
            document.getElementById('upload-modal').style.display = 'none';
            e.target.reset();
            loadMedia();
        });

        document.addEventListener('DOMContentLoaded', loadMedia);
    </script>
</body>

</html>
