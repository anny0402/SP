<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SP Photography</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .login-box {
            max-width: 450px;
            margin: 10vh auto;
            background: var(--surface-color);
            padding: 50px 40px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            text-align: center;
        }

        .login-box h1 {
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid var(--surface-light);
            color: #fff;
            border-radius: 8px;
            outline: none;
        }
    </style>
</head>

<body>
    <div class="login-box fade-in visible">
        <div class="logo" style="margin-bottom: 20px;">SP PHOTOGRAPHY</div>
        <h1 class="serif">CREATE <span style="color: var(--primary-gold);">ACCOUNT</span></h1>

        <form id="signup-form">
            <div class="form-group">
                <label>FULL NAME</label>
                <input type="text" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>EMAIL ADDRESS</label>
                <input type="email" required placeholder="admin@sp.com">
            </div>
            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn" style="width: 100%;">REGISTER</button>
        </form>

        <p style="margin-top: 20px; color: var(--text-dim);">Already have an account? <a href="login.html"
                style="color: var(--primary-gold);">Login</a></p>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Registration is disabled for demo purposes. Use admin@sp.com / password123 to login.');
            window.location.href = 'login.html';
        });
    </script>
</body>

</html>
