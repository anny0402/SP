<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | SP Photography</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--text-dim);
            color: var(--text-muted);
            padding: 8px 25px;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .filter-btn.active,
        .filter-btn:hover {
            border-color: var(--primary-gold);
            color: var(--primary-gold);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-auto-rows: 250px;
            gap: 20px;
            grid-auto-flow: dense;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition-smooth);
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .gallery-item.wide {
            grid-column: span 2;
        }

        .gallery-item.tall {
            grid-row: span 2;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: var(--transition-smooth);
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        .overlay span {
            color: var(--primary-gold);
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
        }
    </style>
</head>

<body>
    <nav id="navbar">
        <div class="logo">SP PHOTOGRAPHY</div>
        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="pricing.html">Pricing</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html" class="btn btn-outline" style="padding: 8px 20px;">Admin Login</a></li>
        </ul>
    </nav>

    <section style="margin-top: 100px;">
        <div class="container">
            <h1 class="reveal-text"
                style="text-align: center; font-size: 3rem; margin-bottom: 40px; margin-left: auto; margin-right: auto; width: fit-content;">
                OUR <span style="color: var(--primary-gold);">PORTFOLIO</span></h1>

            <div class="filter-container">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="wedding">Wedding</button>
                <button class="filter-btn" data-filter="portrait">Portrait</button>
                <button class="filter-btn" data-filter="event">Event</button>
            </div>

            <div class="gallery" id="portfolio-gallery">
                <!-- Gallery items will be dynamically loaded/filtered -->
            </div>
        </div>
    </section>

    <footer style="padding: 50px 5%; border-top: 1px solid var(--glass-border); text-align: center;">
        <div class="logo" style="margin-bottom: 20px;">SP PHOTOGRAPHY</div>
        <p style="color: var(--text-dim);">&copy; 2024 SP Photography. All rights reserved.</p>
    </footer>

    <script src="../js/app.js"></script>
    <script src="../js/gallery.js"></script>
</body>

</html>
